<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GESER Browser Edge (Alternatif)</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 16px auto; padding: 0 12px; color: #212121; background: #F8F9FA; }
    .card { background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    label { display: block; margin-top: 8px; font-weight: 600; font-size: 14px; }
    input, select, button { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ced4da; }
    button { background: #0d6efd; color: #ffffff; border: none; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button.secondary { background: #495057; }
    pre { background: #f1f3f5; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h2>GESER Browser Edge</h2>
  <p><small>Perkiraan berdasarkan gerakan perangkat, bukan pengukuran postur atau alat medis.</small></p>

  <div class="card">
    <label for="projectId">PROJECT_ID (sama dengan .env di laptop)</label>
    <input id="projectId" placeholder="geser-kelompok-xxxx" />
    <label for="role">Peran Perangkat</label>
    <select id="role">
      <option value="body">body (Saku Baju Dada)</option>
      <option value="desk">desk (Atas Meja)</option>
    </select>
    <button id="btnStart">Hubungkan & Mulai Kirim</button>
    <button id="btnCalib" class="secondary">Kalibrasi Baseline (5 detik)</button>
  </div>

  <div class="card">
    <div><strong>Status Broker:</strong> <span id="status">Belum terhubung</span></div>
    <div><strong>Pengingat Terakhir:</strong> <span id="reminder">-</span></div>
    <pre id="out">Menunggu jendela 2 detik...</pre>
  </div>

  <script>
    const G = 9.81, DEG2RAD = Math.PI / 180;
    const runId = Array.from({length: 8}, () => Math.floor(Math.random()*16).toString(16)).join("");
    let client = null, nMsg = 0, gravState = null, prevGrav = null, baseGrav = null, calibLeft = 0, calibVecs = [];
    let accelBuf = [], gyroBuf = [], lastGyroTs = null;

    window.addEventListener("devicemotion", (ev) => {
      const a = ev.accelerationIncludingGravity;
      if (a && a.x !== null) accelBuf.push([a.x, a.y, a.z]);
      const r = ev.rotationRate;
      const now = performance.now() / 1000;
      if (r && r.alpha !== null) {
        const dt = lastGyroTs ? (now - lastGyroTs) : 0;
        lastGyroTs = now;
        gyroBuf.push({ dt, w: [r.beta * DEG2RAD, r.gamma * DEG2RAD, r.alpha * DEG2RAD] });
      }
    });

    function norm(v) {
      const m = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0]/m, v[1]/m, v[2]/m];
    }
    function angleDeg(u, v) {
      const d = Math.max(-1, Math.min(1, u[0]*v[0] + u[1]*v[1] + u[2]*v[2]));
      return Math.acos(d) * (180 / Math.PI);
    }

    document.getElementById("btnCalib").onclick = () => { calibVecs = []; calibLeft = 3; };

    document.getElementById("btnStart").onclick = async () => {
      // Di iOS 13+, izin DeviceMotionEvent harus diminta dari aksi pengguna (klik tombol)
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        try {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm !== "granted") {
            alert("Izin sensor gerak di iOS Safari ditolak. Pastikan mengizinkan akses sensor.");
            return;
          }
        } catch (err) {
          console.warn("Gagal meminta izin DeviceMotionEvent di iOS:", err);
        }
      }

      const pid = document.getElementById("projectId").value.trim();
      if (!pid || pid.endsWith("GANTI")) { alert("Isi PROJECT_ID unik terlebih dahulu."); return; }
      const role = document.getElementById("role").value;
      const root = `geser/${pid}`;
      const presenceTopic = `${root}/edge/${role}/presence`;

      client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
        will: { topic: presenceTopic, payload: "offline", qos: 1, retain: true }
      });

      client.on("connect", () => {
        document.getElementById("status").textContent = "Terhubung (WSS 8884)";
        client.publish(presenceTopic, "online", { qos: 1, retain: true });
        client.subscribe(`${root}/reminders`, { qos: 1 });
        client.subscribe(`${root}/control`, { qos: 1 });
        setInterval(() => stepWindow(root, role), 2000);
      });

      client.on("message", (topic, buf) => {
        try {
          const msg = JSON.parse(buf.toString());
          if (topic.endsWith("/reminders")) {
            document.getElementById("reminder").textContent = `${msg.event} (L${msg.level}): ${msg.message}`;
            if (msg.event === "reminder" && role === "body" && navigator.vibrate) navigator.vibrate(400);
          } else if (topic.endsWith("/control") && msg.cmd === "calibrate" && msg.target === role) {
            calibVecs = []; calibLeft = 3;
          }
        } catch (_) {}
      });
    };

    function stepWindow(root, role) {
      if (!client || !client.connected) return;
      if (accelBuf.length === 0) accelBuf.push([0.02, -0.10, 9.80]);
      const samples = accelBuf.length;
      let rmsSum = 0;
      for (const v of accelBuf) {
        gravState = gravState ? [0.9*gravState[0]+0.1*v[0], 0.9*gravState[1]+0.1*v[1], 0.9*gravState[2]+0.1*v[2]] : v;
        const dev = Math.hypot(v[0], v[1], v[2]) - G;
        rmsSum += dev * dev;
      }
      const gravity = norm(gravState).map(c => Number(c.toFixed(4)));
      const gUnit = norm(gravity);
      if (calibLeft > 0) {
        calibVecs.push(gUnit); calibLeft--;
        if (calibLeft === 0) {
          const sx = calibVecs.reduce((a,b)=>a+b[0],0), sy = calibVecs.reduce((a,b)=>a+b[1],0), sz = calibVecs.reduce((a,b)=>a+b[2],0);
          baseGrav = norm([sx, sy, sz]);
        }
      }
      const stepDeg = prevGrav ? Number(angleDeg(gUnit, prevGrav).toFixed(2)) : 0.0;
      prevGrav = gUnit;
      const tiltDeg = baseGrav ? Number(angleDeg(gUnit, baseGrav).toFixed(2)) : null;

      let gyroPath = 0;
      for (const g of gyroBuf) {
        if (g.dt > 0 && g.dt <= 0.5) gyroPath += Math.hypot(g.w[0], g.w[1], g.w[2]) * g.dt;
      }
      accelBuf = []; gyroBuf = []; nMsg++;

      const payload = {
        v: 1, device: role, run: runId, n_msg: nMsg, t_ms: Date.now(),
        window_s: 2.0, samples: samples, gravity: gravity,
        tilt_deg: tiltDeg, tilt_step_deg: stepDeg,
        accel_dev_rms: Number(Math.sqrt(rmsSum / samples).toFixed(3)),
        gyro_path_rad: Number(gyroPath.toFixed(3)),
        calibrated: baseGrav !== null
      };
      const text = JSON.stringify(payload);
      client.publish(`${root}/edge/${role}/telemetry`, text, { qos: 1 });
      document.getElementById("out").textContent = text;
    }
  </script>
</body>
</html>
