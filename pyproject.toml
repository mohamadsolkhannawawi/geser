[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geser"
version = "0.1.0"
description = "GESER: Gravity-tilt Estimation for Sedentary Event Reminders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt==2.1.0",
    "PyYAML>=6.0,<7",
    "certifi",
]

[project.optional-dependencies]
dashboard = [
    "streamlit==1.40.2",
    "pandas>=2.0,<3",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
geser-edge = "geser.apps.edge_cli:main"
geser-engine = "geser.apps.engine_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/geser"]
exclude = ["src/geser/dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
